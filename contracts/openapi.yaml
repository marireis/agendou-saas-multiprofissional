openapi: 3.1.0
info:
  title: Agendou API
  version: 0.28.0
  description: Identidade, assinatura e perfil. Todas as mutacoes exigem X-CSRF-TOKEN obtido em /auth/csrf, inclusive login e cadastro.
servers:
  - url: http://localhost:8080/api/v1
security:
  - session: []
paths:
  /admin/bookings/{id}/access-code:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Consultar possibilidade de reemissão e histórico
      description: ADMIN do tenant da sessão; no-store. Nunca retorna código/hash. Reservas legadas por email retornam available=false. Consulta permitida após bloqueio da assinatura.
      responses:
        '200':
          description: Metadados e até dez reemissões mais recentes.
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available: {type: boolean}
                  version: {type: integer, minimum: 0}
                  originalName: {type: string, description: Nome original normalizado para acesso.}
                  originalPhone: {type: string}
                  history:
                    type: array
                    maxItems: 10
                    items:
                      type: object
                      required: [version, reason, at]
                      properties:
                        version: {type: integer}
                        reason: {type: string}
                        at: {type: string, format: date-time}
        '401': {description: Sessão ausente.}
        '403': {description: ADMIN ausente.}
        '404': {description: Reserva não encontrada no tenant.}
    post:
      summary: Invalidar código anterior e emitir outro após verificação profissional
      description: ADMIN, assinatura operacional e CSRF. Versão esperada e intervalo mínimo de 60 segundos. Rotação/auditoria atômicas. Código entregue uma única vez nesta resposta no-store. Sessões/recibos com hash anterior deixam de autorizar consultas. Nenhum envio externo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, reason, identityVerified]
              properties:
                expectedVersion: {type: integer, minimum: 0}
                reason: {type: string, minLength: 5, maxLength: 500}
                identityVerified: {type: boolean, const: true}
      responses:
        '200':
          description: Novo código privado; entregar somente ao cliente verificado.
          content:
            application/json:
              schema:
                type: object
                required: [accessCode, version]
                properties:
                  accessCode: {type: string, minLength: 43, maxLength: 43}
                  version: {type: integer, minimum: 1}
        '401': {description: Sessão ausente.}
        '403': {description: ADMIN, assinatura operacional ou CSRF ausentes.}
        '404': {description: Reserva com código não encontrada no tenant.}
        '409': {description: Versão desatualizada ou intervalo mínimo ainda não cumprido.}
        '422': {description: Dados inválidos, motivo insuficiente ou confirmação ausente.}
  /admin/finance:
    get:
      summary: Financeiro do profissional
      description: ADMIN do tenant da sessão; no-store; disponível com assinatura bloqueada. Datas inclusivas no fuso atual do perfil, até 366 dias. Movimentações pela data do lançamento; pendências pelo horário atual do atendimento, usando todo o histórico financeiro. Totais independem da página. Consulta consistente em REPEATABLE READ. Não registra nem transfere dinheiro.
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {name: view, in: query, schema: {type: string, enum: [MOVEMENTS, BALANCES], default: MOVEMENTS}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
      responses:
        '200':
          description: Resumo completo do período e até 50 itens da visão escolhida.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, timezone, view, summary, items, hasMore]
                properties:
                  from: {type: string, format: date}
                  to: {type: string, format: date}
                  timezone: {type: string}
                  view: {type: string, enum: [MOVEMENTS, BALANCES]}
                  hasMore: {type: boolean}
                  summary:
                    type: object
                    required: [receivedCents, refundedCents, netCents, depositDueCents, totalDueCents, refundDueCents, reviewCents]
                    properties:
                      receivedCents: {type: integer, format: int64, minimum: 0}
                      refundedCents: {type: integer, format: int64, minimum: 0}
                      netCents: {type: integer, format: int64, description: Recebido menos devolvido no período; pode ser negativo.}
                      depositDueCents: {type: integer, format: int64, minimum: 0, description: Parte do totalDueCents.}
                      totalDueCents: {type: integer, format: int64, minimum: 0, description: Restante previsto dos atendimentos selecionados.}
                      refundDueCents: {type: integer, format: int64, minimum: 0}
                      reviewCents: {type: integer, format: int64, minimum: 0, description: Crédito em expiradas ou excedentes para avaliação.}
                  items:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      required: [bookingId, customerName, serviceName, at]
                      properties:
                        id: {type: string, format: uuid, description: Somente movimentações.}
                        bookingId: {type: string, format: uuid}
                        customerName: {type: string}
                        serviceName: {type: string}
                        at: {type: string, format: date-time}
                        kind: {type: string, enum: [RECEIPT, REFUND]}
                        amountCents: {type: integer, format: int64, minimum: 0}
                        status: {type: string, description: Estado efetivo da reserva, na visão BALANCES.}
                        netCents: {type: integer, format: int64}
                        depositDueCents: {type: integer, format: int64, minimum: 0}
                        totalDueCents: {type: integer, format: int64, minimum: 0}
                        refundDueCents: {type: integer, format: int64, minimum: 0}
                        reviewCents: {type: integer, format: int64, minimum: 0}
        '400': {description: Datas, período, visão ou paginação inválidos.}
        '401': {description: Sessão ausente.}
        '403': {description: Membership ADMIN ausente.}
  /admin/notifications:
    get:
      summary: Consultar avisos internos do administrador
      description: ADMIN do tenant da sessão. Inclui histórico e permite consulta com assinatura bloqueada. Sem dados de contato, códigos ou PIX. Resposta no-store.
      parameters:
        - {name: unreadOnly, in: query, schema: {type: boolean, default: false}}
        - {name: before, in: query, description: ID do último evento da página anterior; validado no tenant., schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Até 50 eventos ordenados por data/id decrescentes.
          content:
            application/json:
              schema:
                type: object
                required: [items, unreadCount, nextCursor]
                properties:
                  unreadCount: {type: integer, minimum: 0}
                  nextCursor: {type: string, description: Vazio quando não há outra página.}
                  items:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      required: [id, bookingId, type, at, serviceName, start, timezone, read]
                      properties:
                        id: {type: string, format: uuid}
                        bookingId: {type: string, format: uuid}
                        type: {type: string, enum: [REQUESTED, IN_REVIEW, CONFIRMED, RESCHEDULED, EXPIRED, CANCELED, COMPLETED, NO_SHOW, PAYMENT_RECORDED, REFUND_RECORDED]}
                        at: {type: string, format: date-time}
                        serviceName: {type: string}
                        start: {type: string, format: date-time, description: Horário atual da reserva.}
                        timezone: {type: string}
                        read: {type: boolean}
        '401': {description: Sessão ausente.}
        '403': {description: Membership ADMIN ausente.}
        '404': {description: Cursor não encontrado no tenant.}
  /admin/notifications/{id}/read:
    post:
      summary: Marcar aviso como lido pelo administrador atual
      description: ADMIN e CSRF obrigatórios. Idempotente; não altera a leitura de outros administradores nem o atendimento. Resposta no-store.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Leitura registrada ou já existente.}
        '401': {description: Sessão ausente.}
        '403': {description: Membership ADMIN ou CSRF inválido.}
        '404': {description: Aviso não encontrado no tenant.}
  /public/{slug}/phone/review:
    parameters:
      - {name: slug, in: path, required: true, schema: {type: string}}
    post:
      security: []
      summary: Revisar reserva pública sem login ou email
      description: CSRF obrigatório. Nome, sobrenome e telefone com DDD; valida publicação, assinatura e configuração PIX. Sessão de revisão válida por 15 minutos. Não ocupa horário.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/PhoneContact'}
                - type: object
                  required: [serviceId, start]
                  properties:
                    serviceId: {type: string, format: uuid}
                    start: {type: string, format: date-time}
      responses:
        '200': {description: Nome e telefone normalizados, serviço, início/fim, fuso, valores, política, quote e slotAvailable; no-store}
        '404': {description: Página ou serviço indisponível}
        '422': {description: Contato inválido}
        '429': {description: Limite por telefone ou conexão}
    get:
      security: []
      summary: Recuperar revisão da sessão pública
      responses:
        '200': {description: Revisão atualizada; no-store}
        '401': {description: Revisão ausente ou vencida}
  /public/{slug}/phone/bookings:
    post:
      security: []
      summary: Criar reserva e entregar código privado
      description: CSRF e sessão de revisão obrigatórios; sem autenticação de conta. Compartilha quota, alocação e intenção PIX com o fluxo legado. Código de 43 caracteres autoriza apenas esta reserva; guardar antes de sair. Não envia email.
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote, accepted]
              properties:
                quote: {type: string, pattern: '^[a-f0-9]{64}$'}
                accepted: {type: boolean, const: true}
      responses:
        '201': {description: Recibo de reserva temporária e accessCode; no-store. Repetição idêntica devolve a mesma reserva}
        '401': {description: Revisão vencida}
        '409': {description: Horário, quota, condições ou chave conflitantes}
  /public/{slug}/phone/current:
    get:
      security: []
      summary: Recuperar recibo e código na sessão por uma hora
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Detalhe atualizado e accessCode; no-store}
        '404': {description: Sem recibo vigente na sessão}
  /public/{slug}/client/code:
    post:
      security: []
      summary: Consultar reserva com contato e código privado
      description: CSRF obrigatório. Erro genérico; limites por telefone/conexão. Sessão de uma hora, restrita à reserva do código em todos os endpoints de detalhe, pagamento e comprovantes. Não concede acesso a outras reservas do mesmo telefone. Disponível após retirada da página ou bloqueio da assinatura.
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/PhoneContact'}
                - type: object
                  required: [code]
                  properties:
                    code: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
      responses:
        '200': {description: Acesso autorizado; no-store}
        '400': {description: Dados ou código inválidos}
        '429': {description: Limite de tentativas}
  /admin/customers:
    get:
      summary: Buscar clientes do tenant
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 100000}}
      responses:
        '200': {description: items (até 50) e hasMore; id/name/email/phone/version/emailLocked; no-store}
    post:
      summary: Cadastrar cliente sem sobrescrever contato existente
      description: ADMIN, CSRF e assinatura operacional. Deduplicação por email ou por telefone/nome normalizados sem email. Telefone obrigatório sem email.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerEdit'}
      responses:
        '200': {description: Cliente criado ou já existente; no-store}
  /admin/customers/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Cadastro e histórico de atendimentos
      parameters:
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 100000}}
      responses:
        '200': {description: customer, bookings (até 20) e hasMore; no-store}
        '404': {description: Cliente não encontrado neste tenant}
    put:
      summary: Editar cadastro com versão e auditoria
      description: Email não pode mudar após reserva. Contato de acesso por código preserva os dados informados na reserva. ADMIN, CSRF e assinatura operacional.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerEdit'}
      responses:
        '200': {description: Cliente atualizado; no-store}
        '409': {description: Versão, identidade ou duplicidade conflitante}
  /admin/customers/{id}/booking-quote:
    get:
      summary: Consultar valores e política para reserva assistida
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: serviceId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: quote, priceCents, depositCents, timezone e cancellationPolicy; no-store}
  /admin/customers/{id}/bookings:
    post:
      summary: Criar reserva assistida para cliente
      description: ADMIN, CSRF, assinatura operacional, disponibilidade e quota. Publicação não obrigatória. Sem confirmação ou mensagem automática. Cadastro sem email recebe accessCode para repassar ao cliente; repetição na mesma sessão recupera o código.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceId, start, requestKey, quote, confirmed]
              properties:
                serviceId: {type: string, format: uuid}
                start: {type: string, format: date-time}
                requestKey: {type: string, format: uuid}
                quote: {type: string, maxLength: 100}
                confirmed: {type: boolean, const: true}
      responses:
        '200': {description: Recibo idempotente da reserva; accessCode quando aplicável; no-store}
        '409': {description: Horário, quota, valores ou chave conflitantes}
  /admin/bookings/{id}/outcome:
    post:
      summary: Concluir atendimento ou registrar falta
      description: ADMIN, CSRF e assinatura operacional. Somente CONFIRMED após ends_at; versão do horário deve coincidir. Lock serializa com reagendamento/cancelamento. Repetição igual não duplica; decisão diferente conflita. Não altera saldo, intenção de pagamento, quota ou alocação histórica. No-store.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, expectedVersion, reason, confirmed]
              properties:
                status: {type: string, enum: [COMPLETED, NO_SHOW]}
                expectedVersion: {type: integer, minimum: 0}
                reason: {type: string, minLength: 5, maxLength: 1000, description: Observação visível ao cliente}
                confirmed: {type: boolean, const: true}
      responses:
        '200': {description: id e status do atendimento encerrado}
        '403': {description: CSRF/membership/assinatura inválidos}
        '404': {description: Atendimento não encontrado no tenant}
        '409': {description: Não confirmado, horário não terminou, versão mudou ou resultado já registrado com outros dados}
        '422': {description: Observação inválida}
  /admin/bookings/{id}/reschedule-options:
    get:
      summary: Consultar horários para reagendar o mesmo serviço
      description: ADMIN e RLS. Usa duração/buffers originais, expediente atual, fuso da reserva, intervalo, antecedência de 24h e horizonte de 60 dias. Exclui somente a própria ocupação. No-store; consulta não reserva horário.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: version/currentStart/timezone/minDate/maxDate/slots; slots contém start/end UTC}
        '401': {description: Sessão necessária}
        '403': {description: Membership necessária}
        '404': {description: Reserva não encontrada no tenant}
        '409': {description: Reserva não pode ser reagendada}
  /admin/bookings/{id}/reschedule:
    post:
      summary: Reagendar atendimento preservando serviço e pagamentos
      description: ADMIN, CSRF e assinatura operacional. Recalcula disponibilidade sob lock. Troca atômica, sem renovação de prazo. Mês de destino respeita quota. Chave idempotente com conteúdo igual retorna estado atual sem repetir alteração; conteúdo diferente conflita.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestKey, expectedVersion, start, reason]
              properties:
                requestKey: {type: string, format: uuid}
                expectedVersion: {type: integer, minimum: 0}
                start: {type: string, format: date-time}
                reason: {type: string, minLength: 5, maxLength: 1000, description: Motivo visível ao cliente}
      responses:
        '200': {description: id/start/end/version/status da reserva atualizada}
        '403': {description: CSRF/membership/assinatura inválidos}
        '404': {description: Reserva não encontrada no tenant}
        '409': {description: Horário indisponível, reserva inválida, versão/chave em conflito ou quota de destino atingida}
        '422': {description: Motivo inválido}
  /admin/payment-reviews/{id}/cancel:
    post:
      summary: Cancelar atendimento antes do início e registrar decisão financeira
      description: ADMIN, CSRF, assinatura operacional e lock do tenant. Política textual do snapshot revisada pelo operador. Reenvio idêntico não duplica; valores desatualizados retornam conflito. Libera horário e quota provisória; quota confirmada permanece consumida. Não transfere dinheiro. Devolução é registrada separadamente no banco e na API.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, expectedNetCents, refundCents, policyReviewed]
              properties:
                reason: {type: string, minLength: 5, maxLength: 1000, description: Motivo visível ao cliente}
                expectedNetCents: {type: integer, minimum: 0, description: Líquido exibido ao revisar a decisão}
                refundCents: {type: integer, minimum: 0, description: Valor ainda a devolver; não superior ao líquido atual}
                policyReviewed: {type: boolean, const: true}
      responses:
        '200': {description: Detalhe atualizado com CANCELED, cancellation e refundDueCents}
        '403': {description: CSRF/membership/assinatura inválidos}
        '404': {description: Reserva ausente ou de outro tenant}
        '409': {description: Valores mudaram, decisão diferente já registrada, reserva expirada ou atendimento iniciado}
        '422': {description: Motivo ou decisão financeira inválidos}
  /admin/payment-reviews:
    get:
      summary: Listar reservas para conferência do profissional
      description: Membership ADMIN, tenant derivado da sessão, no-store. Em conferência primeiro. Até 50 itens e hasMore; assinatura bloqueada mantém leitura.
      parameters:
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
      responses:
        '200': {description: items e hasMore; itens com id/status/customerName/serviceName/start/timezone/depositCents/deadline}
        '401': {description: Sessão necessária}
        '403': {description: Membership ausente}
  /admin/payment-reviews/{id}:
    get:
      summary: Detalhe financeiro privado da reserva
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Dados da lista mais totalCents/receivedCents/grossReceivedCents/refundedCents/financialStatus/evidence/transactions/refunds; no-store}
        '404': {description: Reserva ausente ou de outro tenant}
  /admin/payment-reviews/{id}/evidence/{evidence}:
    get:
      summary: Baixar comprovante como administrador do tenant
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: evidence, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Attachment privado PNG/PDF; no-store, nosniff e CSP sandbox}
        '404': {description: Reserva ou comprovante fora do tenant/vínculo}
        '503': {description: Storage indisponível}
  /admin/payment-reviews/{id}/receipts:
    post:
      summary: Registrar crédito conferido no banco
      description: Exige ADMIN, CSRF e assinatura operacional. Referência normalizada trim/uppercase única por tenant; repetição idêntica não duplica. Recebimento tardio é registrado sem reabrir reserva. Confirmação exige líquido entre entrada e total, prazo e alocação válidos. Valores em centavos, sem transferência automática.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountCents, bankReference, receivingAccount, receivedAt, verified]
              properties:
                amountCents: {type: integer, minimum: 1, maximum: 1000000000}
                bankReference: {type: string, minLength: 1, maxLength: 200}
                receivingAccount: {type: string, minLength: 2, maxLength: 120}
                receivedAt: {type: string, format: date-time, description: Entre criação da reserva e agora}
                verified: {type: boolean, const: true}
      responses:
        '200': {description: Detalhe atualizado; confirmação e lançamento atômicos}
        '403': {description: CSRF/membership/assinatura inválidos}
        '404': {description: Reserva ausente ou de outro tenant}
        '409': {description: Referência com dados conflitantes ou alocação indisponível}
        '422': {description: Dados ou data inválidos}
  /admin/payment-reviews/{id}/refunds:
    post:
      summary: Registrar devolução já realizada no banco
      description: Exige ADMIN, CSRF e assinatura operacional. Idempotência pela referência normalizada e dados iguais. Limite cumulativo por recebimento sob lock. Não executa transferência nem reabre reserva expirada. Reduzir entrada de confirmada exige cancelamento prévio. Cancelada limita devolução à decisão registrada.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionId, amountCents, bankReference, reason, refundedAt, verified]
              properties:
                transactionId: {type: string, format: uuid}
                amountCents: {type: integer, minimum: 1, maximum: 1000000000}
                bankReference: {type: string, minLength: 1, maxLength: 200}
                reason: {type: string, minLength: 5, maxLength: 1000}
                refundedAt: {type: string, format: date-time, description: Entre recebimento original e agora}
                verified: {type: boolean, const: true}
      responses:
        '200': {description: Detalhe atualizado; histórico preservado}
        '403': {description: CSRF/membership/assinatura inválidos}
        '404': {description: Reserva ou recebimento fora do tenant/vínculo}
        '409': {description: Referência conflitante, limite excedido ou entrada confirmada comprometida}
        '422': {description: Dados ou data inválidos}
  /public/{slug}/client/bookings/{id}/evidence:
    post:
      summary: Enviar comprovante privado sem confirmar pagamento
      description: Sessão de cliente, propriedade e CSRF obrigatórios. JPEG/PNG/PDF validados por conteúdo, até 5 MB. Primeiro envio no prazo muda para IN_REVIEW por 24h; reenvio não renova prazo. Mesmo conteúdo devolve mesmo ID. Até cinco arquivos por reserva.
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '201': {description: id, status e expiresAt; upload não confirma pagamento}
        '401': {description: Acesso de cliente ausente ou expirado}
        '403': {description: CSRF inválido}
        '404': {description: Reserva não encontrada ou de outro cliente}
        '409': {description: Prazo encerrado ou limite de arquivos atingido}
        '413': {description: Arquivo maior que 5 MB}
        '422': {description: Conteúdo inválido, ativo, protegido ou além dos limites de páginas/pixels}
        '503': {description: Armazenamento indisponível, sem mudança de estado}
  /public/{slug}/client/bookings/{id}/evidence/{evidence}:
    get:
      summary: Download autorizado do comprovante
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: evidence, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Attachment PNG/PDF, no-store, nosniff, CSP sandbox. Nunca retorna URL ou chave S3.}
        '401': {description: Sessão necessária}
        '404': {description: Reserva/comprovante não encontrado ou de outro cliente}
        '503': {description: Armazenamento indisponível}
  /public/{slug}/client/bookings/{id}/payment:
    get:
      summary: Prévia privada do PIX preservado na reserva
      description: Exige sessão de cliente verificado e propriedade da reserva. Não confirma recebimento nem permite transferência automática. paymentAvailable=true somente para reservas pendentes; confirmação, cancelamento e expiração ocultam dados PIX. Sem cache. Consulta preservada após retirada da página ou bloqueio da assinatura.
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Valores em centavos calculados no servidor; chave/recebedor/instruções omitidos após expiração
          content:
            application/json:
              schema:
                type: object
                required: [id, provider, status, totalCents, depositCents, remainingAfterDepositCents, deadline, timezone, paymentAvailable]
                properties:
                  id: {type: string, format: uuid}
                  provider: {type: string, const: MANUAL_PIX}
                  status: {type: string, enum: [AWAITING_PAYMENT, IN_REVIEW, CONFIRMED, EXPIRED, CANCELED, COMPLETED, NO_SHOW]}
                  cancellation: {type: object, description: Presente após cancelamento; reason, retainedCents e at}
                  refundDueCents: {type: integer, minimum: 0, description: Devolução ainda pendente após cancelamento}
                  receivedCents: {type: integer, description: Recebimentos menos devoluções registrados manualmente}
                  refundedCents: {type: integer}
                  financialStatus: {type: string, enum: [UNPAID, INSUFFICIENT, EXCESS, LATE, REFUNDED, DEPOSIT_PAID, PAID, REFUND_DUE, CANCELED_SETTLED]}
                  totalCents: {type: integer}
                  depositCents: {type: integer}
                  remainingAfterDepositCents: {type: integer, description: Saldo projetado depois de pagar a entrada; não representa recebimento confirmado}
                  deadline: {type: string, format: date-time}
                  timezone: {type: string}
                  paymentAvailable: {type: boolean}
                  keyType: {type: string}
                  pixKey: {type: string}
                  recipientName: {type: string}
                  instructions: {type: string}
                  evidence:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        mediaType: {type: string}
                        createdAt: {type: string, format: date-time}
        '401': {description: Sessão de cliente ausente ou expirada}
        '404': {description: Reserva/intenção inexistente ou de outro cliente}
  /public/{slug}/client/access-links:
    post:
      security: []
      summary: Solicitar acesso a Meus agendamentos por email
      description: Resposta genérica, CSRF e limites por email/conexão. Só envia para cliente existente; funciona com página retirada ou assinatura bloqueada. Reenvio revoga link anterior do mesmo tenant/email.
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 254}
      responses:
        '202': {description: Resposta genérica sem confirmar existência de cliente ou profissional}
        '403': {description: CSRF inválido}
        '429': {$ref: '#/components/responses/RateLimited'}
  /public/{slug}/client/access-links/consume:
    post:
      security: []
      summary: Consumir link único de 15 minutos e abrir sessão de cliente por uma hora
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token]
              properties:
                email: {type: string, format: email, maxLength: 254}
                token: {type: string, maxLength: 128}
      responses:
        '200': {description: Cookie de sessão rotacionado, acesso restrito ao slug/email e sem privilégios administrativos}
        '400': {description: Link inválido, expirado, revogado ou de outro escopo}
        '403': {description: CSRF inválido}
  /public/{slug}/client/bookings:
    get:
      summary: Listar somente as reservas do cliente verificado
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 10000, default: 0}}
      responses:
        '200': {description: 'No-store. items (até 20 recibos), hasMore, offset e email. Ordenação por início decrescente e ID. Expira reservas vencidas antes de consultar; não expõe PIX.'}
        '400': {description: Offset inválido}
        '401': {description: Sessão de cliente ausente, expirada ou de outro slug}
  /public/{slug}/client/bookings/{id}:
    get:
      summary: Detalhe autorizado com valores e política preservados, modalidade/local e histórico
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 'No-store. Recibo mais businessName, serviceMode, location, cancellationPolicy e events (type/at). Sem chave PIX ou dados de terceiros.'}
        '401': {description: Sessão de cliente ausente ou expirada}
        '404': {description: Reserva inexistente ou de outro cliente}
  /public/{slug}/client/logout:
    post:
      summary: Encerrar acessos de cliente e revisão nesta sessão, preservando login administrativo
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Acessos de cliente removidos, no-store}
        '403': {description: CSRF inválido}
  /public/{slug}/bookings:
    post:
      summary: Criar reserva temporária com sessão de email verificado, CSRF e idempotência
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote]
              properties:
                quote: {type: string, pattern: '^[a-f0-9]{64}$', description: Hash retornado pela revisão aceita pelo cliente}
      responses:
        '201': {description: Recibo da criação com id/status/start/end/expiresAt/timezone/serviceName/priceCents/depositCents/paymentAvailable; mesma chave/corpo repete recibo original sem novo efeito. no-store}
        '400': {description: Cabeçalho ou corpo malformado}
        '401': {description: Sessão de revisão ausente, expirada ou de outro slug}
        '403': {description: CSRF inválido ou assinatura bloqueada para nova reserva}
        '404': {description: Página indisponível}
        '409': {description: Horário ocupado, quota atingida, condições alteradas ou chave reutilizada com outra solicitação}
        '429': {description: Limite por conexão}
  /public/{slug}/bookings/current:
    get:
      summary: Recibo recente do próprio cliente na sessão; não é listagem de reservas
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Recibo com estado atual e no-store; acesso até cinco minutos após o prazo}
        '404': {description: Recibo ausente ou acesso expirado}
  /public/{slug}/bookings/{id}:
    get:
      summary: Consultar solicitação do mesmo email/tenant na sessão verificada
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Recibo atualizado sem snapshots PIX; leitura preservada após bloqueio/retirada}
        '401': {description: Sessão verificada ausente ou expirada}
        '404': {description: Solicitação ausente ou de outro cliente}
  /public/{slug}/availability:
    get:
      security: []
      summary: Dias e horários disponíveis do serviço público
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
        - {name: serviceId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: date, in: query, schema: {type: string, format: date}}
      responses:
        '200':
          description: Sem cache; 60 dias com date/available, slots start/end apenas da data solicitada, today, timezone e reservationEnabled=true. Nenhuma ocupação privada.
        '404': {description: Página não publicada ou serviço indisponível/externo}
        '403': {description: Assinatura não operacional}
        '422': {description: Data fora do horizonte}
        '429': {description: Limite por conexão; Retry-After}
  /public/{slug}/access-links:
    post:
      security: []
      summary: Solicitar email de uso único para revisão, com CSRF
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceId, start, name, email]
              properties:
                serviceId: {type: string, format: uuid}
                start: {type: string, format: date-time}
                name: {type: string, minLength: 1, maxLength: 100}
                email: {type: string, format: email, maxLength: 254}
      responses:
        '202': {description: Resposta genérica; nenhum horário reservado. Link de uso único válido por 15 minutos}
        '403': {description: CSRF inválido ou assinatura bloqueada}
        '404': {description: Página/serviço indisponível}
        '409': {description: Horário não disponível}
        '429': {description: Limite por email ou conexão; Retry-After}
  /public/{slug}/access-links/consume:
    post:
      security: []
      summary: Consumir token com CSRF e criar sessão de revisão restrita ao slug
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200': {description: 'Revisão privada com nome/email, serviço, início/fim/fuso, preço/entrada atuais em centavos, slotAvailable, reservationEnabled=true, cancellationPolicy e quote (SHA-256 das condições atuais); no-store'}
        '400': {description: Link inválido, expirado, de outro tenant ou já consumido}
        '403': {description: CSRF inválido ou assinatura bloqueada}
        '404': {description: Página/serviço indisponível}
        '429': {description: Limite por conexão}
  /public/{slug}/review:
    get:
      summary: Revisão na sessão verificada por 15 minutos; não é reserva
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Mesma revisão do consumo, com preço/disponibilidade recalculados e no-store}
        '401': {description: Sessão de revisão ausente, expirada ou de outro slug}
        '403': {description: Assinatura bloqueada}
        '404': {description: Página/serviço indisponível}
  /admin/calendar:
    get:
      summary: Calendário privado diário, semanal ou mensal com disponibilidade e ocupações vigentes
      description: Snapshot consistente, sem cache e com RLS. Limites civis no fuso do perfil, inclusive dias de 23/25 horas. Inclui faixas protegidas que atravessam o período; omite alocações liberadas e HOLDs expirados. Datas passadas mostram expediente atual, não histórico de configuração. Consulta permitida após bloqueio da assinatura.
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}, description: 'Primeiro dia inclusivo; padrão hoje no fuso do perfil, ano 2000 a 2100'}
        - {name: days, in: query, schema: {type: integer, enum: [1, 7, 42], default: 7}, description: '42 dias permitem a grade mensal de seis semanas'}
      responses:
        '200':
          description: Datas, expediente e faixas ocupadas reais; não representa reservas confirmadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  timezone: {type: string}
                  today: {type: string, format: date}
                  from: {type: string, format: date}
                  generatedAt: {type: string, format: date-time}
                  intervalMinutes: {type: integer}
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        date: {type: string, format: date}
                        start: {type: string, format: date-time}
                        end: {type: string, format: date-time}
                        exception: {type: boolean}
                        status: {type: string, enum: [FREE, OCCUPIED, UNAVAILABLE], description: 'UNAVAILABLE tem prioridade se nenhum serviço ativo possui início disponível. OCCUPIED indica ocupação temporária e disponibilidade restante; FREE indica disponibilidade sem ocupações. Considera todas as regras do gerador.'}
                        occupiedCount: {type: integer, minimum: 0, description: 'Ocupações não BLOCK cujo atendimento cruza o dia; não representa reservas confirmadas'}
                        reason: {type: string}
                        periods: {type: array, items: {$ref: '#/components/schemas/AvailabilityPeriod'}}
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        kind: {type: string, enum: [BLOCK, HOLD, BOOKING]}
                        bookingId: {type: [string, 'null'], format: uuid, description: Reserva temporária vinculada à alocação}
                        serviceName: {type: [string, 'null'], description: Nome preservado no snapshot da reserva}
                        bookingStatus: {type: [string, 'null'], description: Estado da reserva, incluindo IN_REVIEW para conferência pendente}
                        start: {type: string, format: date-time}
                        end: {type: string, format: date-time}
                        protectedStart: {type: string, format: date-time}
                        protectedEnd: {type: string, format: date-time}
                        expiresAt: {type: [string, 'null'], format: date-time}
                        reason: {type: string}
        '400': {description: Data malformada ou quantidade de dias diferente de 1/7/42}
        '401': {description: Sessão necessária}
        '422': {description: Ano fora de 2000 a 2100}
  /admin/calendar/blocks:
    get:
      summary: Bloqueios pontuais ativos do próprio tenant, incluindo em andamento
      parameters:
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
      responses:
        '200':
          description: Até 50 itens por página, sem cache; leitura preservada após bloqueio de assinatura
          content:
            application/json:
              schema:
                type: object
                properties:
                  timezone: {type: string}
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        start: {type: string, format: date-time}
                        end: {type: string, format: date-time}
                        reason: {type: string}
        '401': {description: Sessão necessária}
    post:
      summary: Bloquear período futuro no recurso único do profissional
      description: CSRF e assinatura operacional. Datas locais no fuso do perfil, sem offset; convertidas para UTC. Limites ambíguos/inexistentes rejeitados. Não cria reserva de cliente nem pagamento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start, end, reason]
              properties:
                start: {type: string, example: '2026-10-01T09:00'}
                end: {type: string, example: '2026-10-01T10:00'}
                reason: {type: string, minLength: 1, maxLength: 200}
      responses:
        '201':
          description: Bloqueio criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
        '401': {description: Sessão necessária}
        '403': {description: CSRF ou assinatura bloqueada}
        '409': {description: Sobreposição com bloqueio ou ocupação ativa; recarregar}
        '422': {description: Intervalo inválido, no passado, maior que 366 dias ou horário ambíguo/inexistente}
  /admin/calendar/blocks/{id}:
    delete:
      summary: Liberar bloqueio próprio preservando registro histórico
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Liberado, inclusive repetição de liberação}
        '401': {description: Sessão necessária}
        '403': {description: CSRF ou assinatura bloqueada}
        '404': {description: Bloqueio inexistente ou de outro tenant}
  /admin/availability/slots:
    get:
      summary: Prévia privada de candidatos e sequência de atendimentos sem criar reservas
      description: Usa configuração salva, serviço ativo do tenant e fuso do perfil; antecedência 24h, horizonte de hoje a hoje+59 dias, grade local 15min. Períodos que atravessam mudança de offset são omitidos. Candidatos são alternativas; sequência respeita intervalo e buffers. Consulta alocações ativas e ignora HOLDs expirados. Bloqueios usam a faixa exata mais buffers do serviço, sem intervalo global adicional.
      parameters:
        - {name: serviceId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200':
          description: Sem cache; leitura preservada após bloqueio da assinatura
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: {type: string, format: date}
                  today: {type: string, format: date}
                  lastDate: {type: string, format: date}
                  timezone: {type: string}
                  intervalMinutes: {type: integer}
                  bookingAvailable: {type: boolean, const: false}
                  candidates: {type: array, items: {$ref: '#/components/schemas/SlotCandidate'}}
                  sequence: {type: array, items: {$ref: '#/components/schemas/SlotCandidate'}}
        '401': {description: Sessão necessária}
        '404': {description: Serviço inexistente, inativo ou de outro tenant}
        '422': {description: Data fora do horizonte}
  /admin/availability:
    get:
      summary: Horários privados do profissional autenticado, com versão e fuso atual do perfil
      responses:
        '200':
          description: Sem cache; configuração inicial vazia tem versão zero
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: {type: integer, minimum: 0}
                  timezone: {type: string}
                  schedule: {$ref: '#/components/schemas/AvailabilitySchedule'}
        '401': {description: Sessão necessária}
    put:
      summary: Substituir configuração completa com CSRF, assinatura operacional e versão
      description: Dias ISO 1 a 7. Exceção substitui o expediente da data; períodos vazios fecham o dia. Pausas são intervalos entre períodos. Sem períodos noturnos cruzando meia-noite; prévia em /admin/availability/slots.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, schedule]
              properties:
                version: {type: integer, minimum: 0}
                schedule: {$ref: '#/components/schemas/AvailabilitySchedule'}
      responses:
        '200': {description: Configuração salva e versão incrementada, mesmo formato do GET}
        '400': {description: JSON ou data/hora malformados}
        '401': {description: Sessão necessária}
        '403': {description: CSRF ou assinatura bloqueada}
        '409': {description: Versão desatualizada; recarregar}
        '422': {description: Campos inválidos, sobreposição, dias/datas repetidos ou período invertido}
  /admin/publication:
    get:
      summary: Estado e requisitos reais de publicação do profissional autenticado
      responses:
        '200':
          description: Sem cache; requisitos calculados sob lock do tenant, incluindo candidatos reais nos próximos 60 dias
          content:
            application/json:
              schema:
                type: object
                required: [published, canPublish, missingRequirements, path]
                properties:
                  published: {type: boolean}
                  canPublish: {type: boolean}
                  missingRequirements: {type: array, items: {type: string}}
                  path: {type: string}
        '401': {description: Sessão necessária}
    post:
      summary: Publicar explicitamente a própria página após revalidar os requisitos
      description: Exige perfil completo, assinatura operacional, serviço ativo, PIX/política ativos e horário livre real no horizonte de 60 dias. Mesma coordenação das mutações de configuração e calendário. Não habilita reservas nem expõe a chave PIX. Nenhuma publicação automática.
      responses:
        '204': {description: Página publicada; repetir com requisitos válidos não duplica efeitos}
        '409': {description: Requisitos não atendidos; nenhuma publicação realizada}
        '403': {description: Assinatura bloqueada ou CSRF inválido}
        '401': {description: Sessão necessária}
    delete:
      summary: Retirar somente a própria página do ar, inclusive com assinatura bloqueada
      responses:
        '204': {description: Retirada idempotente sem excluir dados}
        '403': {description: CSRF inválido ou membership ausente}
        '401': {description: Sessão necessária}
  /public/pages/{slug}:
    parameters:
      - {name: slug, in: path, required: true, schema: {type: string}}
    get:
      security: []
      summary: Projeção pública sem PIX, identidade do usuário ou tenant ID
      responses:
        '404': {description: Slug inexistente ou página não publicada, sem distinção}
        '200':
          description: Sem cache; reservas indisponíveis nesta versão
          content:
            application/json:
              schema:
                type: object
                required: [name, slug, description, timezone, contactEmail, contactPhone, serviceMode, location, hasLogo, bookingAvailable, services]
                properties:
                  name: {type: string}
                  slug: {type: string}
                  description: {type: string}
                  timezone: {type: string}
                  contactEmail: {type: string}
                  contactPhone: {type: string}
                  serviceMode: {type: string}
                  location: {type: string}
                  hasLogo: {type: boolean}
                  bookingAvailable: {type: boolean, const: false}
                  services:
                    type: array
                    items:
                      type: object
                      required: [id, name, description, durationMinutes, priceCents, depositCents]
                      properties:
                        id: {type: string, format: uuid}
                        name: {type: string}
                        description: {type: string}
                        durationMinutes: {type: integer}
                        priceCents: {type: integer}
                        depositCents: {type: integer}
  /public/pages/{slug}/logo:
    parameters:
      - {name: slug, in: path, required: true, schema: {type: string}}
    get:
      security: []
      responses:
        '200':
          description: Variante PNG saneada, sem cache, nosniff
          content:
            image/png:
              schema: {type: string, format: binary}
        '404': {description: Página não publicada, inexistente ou sem logo}
  /health:
    get:
      security: []
      responses:
        '200': {description: API disponivel}
  /auth/csrf:
    get:
      security: []
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Token e nome do header CSRF; guardar o cookie de sessao
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string}
                  headerName: {type: string}
  /auth/register:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name, slug]
              properties:
                email: {type: string, format: email, maxLength: 254}
                password: {type: string, minLength: 12, maxLength: 64}
                name: {type: string, minLength: 1, maxLength: 100}
                slug: {type: string, minLength: 3, maxLength: 60, pattern: '[a-z0-9]+(?:-[a-z0-9]+)*'}
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '202': {description: Resposta generica; cadastro novo cria tenant e trial Premium de 7 dias atomicamente}
        '409': {description: Slug indisponivel ou conflito de cadastro}
        '422': {description: Campos invalidos}
  /auth/verification-email:
    post:
      security: []
      summary: Solicitar novo link de verificacao sem reiniciar o trial
      description: Resposta generica para conta inexistente, verificada ou aguardando verificacao. Reenvios em menos de 60 segundos sao agrupados. Novo token revoga o anterior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 254}
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '202': {description: Solicitacao recebida, sem confirmar existencia da conta}
        '403': {description: CSRF ausente ou invalido}
        '422': {description: Email invalido}
  /auth/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, maxLength: 64}
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '200': {description: Sessao JDBC criada; cookie SESSION HttpOnly, Secure e SameSite=Lax. Obter novo CSRF depois do login.}
        '401': {description: Credenciais invalidas ou email nao verificado}
  /auth/verify:
    post:
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Token'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '200': {description: Email verificado}
        '400': {description: Token expirado ou ja utilizado}
  /auth/logout:
    post:
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '204': {description: Sessao invalidada}
  /auth/password-reset:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '202': {description: Resposta generica sem revelar existencia da conta}
  /auth/password-reset/confirm:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string, maxLength: 128}
                password: {type: string, minLength: 12, maxLength: 64}
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '200': {description: Senha alterada e sessoes anteriores revogadas}
        '400': {description: Token expirado ou utilizado}
  /admin/subscription:
    get:
      responses:
        '200':
          description: Assinatura do tenant derivado da membership autenticada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscription'}
        '401': {description: Sessao ausente}
  /subscriptions/{tenantId}:
    get:
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Alias autenticado; somente o proprio tenant
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscription'}
        '404': {description: Tenant nao pertence ao usuario}
  /admin/profile:
    get:
      responses:
        '200':
          description: Perfil preservado inclusive durante bloqueio
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, timezone]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                description: {type: string, maxLength: 2000}
                timezone: {type: string, example: America/Sao_Paulo}
                contactEmail: {type: string, maxLength: 254, description: Email comercial valido ou vazio; omitir preserva valor anterior}
                contactPhone: {type: string, maxLength: 24, description: Telefone comercial com digitos e separadores usuais ou vazio}
                serviceMode: {type: string, enum: [UNSET, IN_PERSON, ONLINE, HYBRID]}
                location: {type: string, maxLength: 500, description: Local de atendimento; necessario para completar perfil presencial/hibrido}
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        '403': {description: Assinatura bloqueada ou CSRF invalido}
        '422': {description: Entrada invalida}
  /admin/profile/logo:
    get:
      summary: Consultar somente a logomarca do profissional autenticado, inclusive bloqueado
      responses:
        '200':
          description: Variante PNG saneada; no-store e nosniff
          content:
            image/png:
              schema: {type: string, format: binary}
        '401': {description: Sessao necessaria}
        '404': {description: Sem logomarca}
    put:
      summary: Enviar ou substituir logo PNG/JPEG, com CSRF e assinatura operacional
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary, description: Bytes brutos ate 2097152; formato verificado pelo conteudo, maximo 4096 por lado e 16 milhoes de pixels}
      responses:
        '200':
          description: Perfil atualizado; original descartado e variante PNG ate 512 pixels persistida
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        '403': {description: Assinatura bloqueada ou CSRF invalido}
        '413': {description: Arquivo maior que 2 MiB}
        '422': {description: Formato, conteudo ou dimensoes invalidos; logo anterior preservada}
    delete:
      summary: Remover logo do proprio perfil, com CSRF e assinatura operacional
      responses:
        '200':
          description: Perfil atualizado, sem logo; remocao idempotente
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        '403': {description: Assinatura bloqueada ou CSRF invalido}
  /admin/services:
    get:
      summary: Catalogo do proprio tenant, inclusive com assinatura bloqueada
      parameters:
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Ate 50 registros ordenados por criacao/id; total e activeCount do tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Service'}}
                  total: {type: integer}
                  activeCount: {type: integer}
        '401': {description: Sessao necessaria}
    post:
      summary: Cadastrar servico com assinatura operacional e CSRF
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServiceEdit'}
      responses:
        '201':
          description: Servico cadastrado; sem publicacao automatica
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Service'}
        '403': {description: Assinatura bloqueada ou CSRF invalido}
        '422': {description: Campos fora dos limites}
        '400': {description: JSON invalido ou numeros fracionarios em campos inteiros}
  /admin/services/{id}:
    put:
      summary: Editar ou inativar/reativar servico, preservando registro; version obrigatoria
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/ServiceEdit'}
                - required: [version]
      responses:
        '200':
          description: Servico atualizado com incremento de versao
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Service'}
        '403': {description: Assinatura bloqueada ou CSRF invalido}
        '404': {description: Servico inexistente ou de outro tenant}
        '409': {description: Versao desatualizada; recarregar e revisar antes de repetir}
        '422': {description: Campos invalidos ou versao ausente}
  /admin/payment-settings:
    get:
      summary: Configuracao PIX atual do proprio tenant; leitura preservada apos bloqueio
      responses:
        '200':
          description: no-store; configured=false e version=0 se ainda nao configurado
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [configured, version]
                    properties:
                      configured: {const: false}
                      version: {const: 0}
                  - {$ref: '#/components/schemas/PaymentSettings'}
        '401': {description: Sessao necessaria}
    put:
      summary: Gravar nova versao imutavel com CSRF e assinatura operacional
      description: Valida somente formato/DV. Nao consulta DICT, confirma titularidade, publica agenda ou confirma pagamento. Versao inicial zero; dados identicos nao criam nova revisao.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/PaymentSettingsFields'}
                - type: object
                  required: [version, confirmed, changeReason]
                  properties:
                    version: {type: integer, minimum: 0}
                    confirmed: {type: boolean, const: true, description: Declaracao de conferencia dos dados pelo profissional}
                    changeReason: {type: string, minLength: 10, maxLength: 500}
      responses:
        '200':
          description: Configuracao atual gravada; no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentSettings'}
        '403': {description: Assinatura bloqueada ou CSRF invalido}
        '409': {description: Versao desatualizada; recarregar e revisar}
        '422': {description: Chave/campos invalidos ou conferencia nao confirmada}
  /admin/payment-settings/history:
    get:
      summary: Ate 50 metadados de revisao, sem chaves ou textos privados
      parameters:
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Ordem de versao decrescente; no-store
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    version: {type: integer}
                    actorId: {type: string, format: uuid}
                    changedFields: {type: array, items: {type: string}}
                    enabled: {type: boolean}
                    createdAt: {type: string, format: date-time}
                    correlationId: {type: string}
        '401': {description: Sessao necessaria}
  /platform/session:
    get:
      summary: Estado do MFA da conta com PlatformRole SUPER_ADMIN
      responses:
        '200':
          description: Estado sem segredos; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrolled: {type: boolean}
                  verified: {type: boolean}
        '401': {description: Login necessario}
        '403': {description: Conta sem papel de plataforma}
  /platform/mfa/enrollment:
    post:
      summary: Iniciar configuracao TOTP com senha atual e papel de plataforma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, maxLength: 64}
      responses:
        '200':
          description: Chave Base32 de configuracao manual, validade 10 minutos; nao registrar nem armazenar no frontend
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: {type: string}
                  issuer: {type: string}
                  account: {type: string}
                  algorithm: {type: string, const: SHA1}
                  digits: {type: string, const: '6'}
                  period: {type: string, const: '30'}
        '401': {description: Senha invalida ou sessao ausente}
        '403': {description: Papel ausente ou CSRF invalido}
        '409': {description: Autenticador ja ativado}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {description: Chave de criptografia nao configurada}
  /platform/mfa/verify:
    post:
      summary: Ativar autenticador ou elevar sessao por 15 minutos, rotacionando seu identificador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, pattern: '^[0-9]{6}$'}
      responses:
        '200': {description: MFA confirmado, codigo consumido uma unica vez}
        '400': {description: Codigo invalido, expirado ou reutilizado}
        '401': {description: Login necessario}
        '403': {description: Papel ausente ou CSRF invalido}
        '429': {$ref: '#/components/responses/RateLimited'}
  /platform/tenants:
    get:
      summary: Listar ate 50 profissionais; exige papel e MFA vigente
      parameters:
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200': {description: Lista com id, slug, display_name, subscription_status, plan_code, trial_ends_at e paid_until; sem dados de clientes}
        '403': {description: Papel ausente ou MFA vencido}
  /platform/tenants/{tenantId}:
    get:
      summary: Consultar estado atualizado da assinatura e ultimas 50 decisoes
      parameters:
        - {$ref: '#/components/parameters/PlatformTenant'}
      responses:
        '200': {description: tenant, subscription e decisions; acesso auditado e protegido por MFA}
        '403': {description: Papel ausente ou MFA vencido}
        '404': {description: Profissional inexistente}
  /platform/tenants/{tenantId}/decisions:
    post:
      summary: Decisao administrativa atomica com role e MFA; nao e confirmacao automatica de banco/PIX
      parameters:
        - {$ref: '#/components/parameters/PlatformTenant'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, action, reason]
              properties:
                id: {type: string, format: uuid, description: Reutilizar para repetir a mesma decisao apos falha de rede}
                action: {type: string, enum: [CONFIRM_PAYMENT, SUSPEND, REACTIVATE]}
                reason: {type: string, minLength: 10, maxLength: 500}
                reference: {type: string, minLength: 3, maxLength: 100, description: Obrigatoria e globalmente unica para pagamento; omitir nas outras acoes}
                amountCents: {type: integer, minimum: 1, maximum: 100000000, description: Obrigatorio para pagamento; omitir nas outras acoes}
                planCode: {type: string, enum: [BASIC, INTERMEDIATE, PREMIUM_TOP], description: Obrigatorio para pagamento; omitir nas outras acoes}
      responses:
        '200': {description: Estado resultante; pagamento soma 30 dias; retirar suspensao respeita vigencia original}
        '400': {description: Combinacao de campos invalida}
        '403': {description: Papel/MFA ausente ou CSRF invalido}
        '404': {description: Profissional inexistente}
        '409': {description: Referencia duplicada, identificador reutilizado com outros dados ou transicao invalida; nenhuma mudanca parcial}
        '422': {description: Campos invalidos}
  /platform/audit:
    get:
      summary: Consultar ate 50 eventos de plataforma com MFA, sem tokens ou contatos
      parameters:
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200': {description: id, actor_id, action, tenant_id, correlation_id e created_at}
        '403': {description: Papel ausente ou MFA vencido}
components:
  parameters:
    Offset:
      name: offset
      in: query
      schema: {type: integer, default: 0, minimum: 0, maximum: 100000}
    PlatformTenant:
      name: tenantId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    RateLimited:
      description: Limite de tentativas excedido. Aguardar Retry-After antes de repetir.
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
          description: Segundos restantes ate a proxima janela
        X-Correlation-ID:
          schema: {type: string, format: uuid}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  securitySchemes:
    session: {type: apiKey, in: cookie, name: SESSION}
  requestBodies:
    Token:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: {type: string, maxLength: 128}
  schemas:
    PhoneContact:
      type: object
      required: [firstName, lastName, phone]
      properties:
        firstName: {type: string, minLength: 2, maxLength: 50}
        lastName: {type: string, minLength: 2, maxLength: 49}
        phone: {type: string, maxLength: 25, description: Telefone brasileiro com DDD; normalizado para 10 ou 11 dígitos}
    CustomerEdit:
      type: object
      required: [name, email, phone, version]
      properties:
        name: {type: string, minLength: 2, maxLength: 100}
        email: {type: string, maxLength: 254, description: Email legado opcional; enviar string vazia para cadastro sem email}
        phone: {type: string, maxLength: 25}
        version: {type: integer, minimum: 0}
    SlotCandidate:
      type: object
      required: [start, end]
      properties:
        start: {type: string, format: date-time, description: Início em UTC}
        end: {type: string, format: date-time, description: Fim em UTC}
    AvailabilityPeriod:
      type: object
      required: [start, end]
      properties:
        start: {type: string, example: '09:00', description: 'Hora local com precisão de minutos; segundos/nanos não zero são rejeitados'}
        end: {type: string, example: '12:00'}
    AvailabilitySchedule:
      type: object
      required: [weekly, exceptions]
      properties:
        intervalMinutes: {type: integer, minimum: 0, maximum: 240, default: 0, description: 'Tempo livre mínimo entre atendimentos, em todos os dias. Ausente/null em documentos antigos vira zero. Aplicado à sequência e ao conflito entre atendimentos persistidos; bloqueios pontuais não adicionam intervalo global.'}
        weekly:
          type: array
          maxItems: 7
          items:
            type: object
            required: [day, periods]
            properties:
              day: {type: integer, minimum: 1, maximum: 7}
              periods:
                type: array
                maxItems: 8
                items: {$ref: '#/components/schemas/AvailabilityPeriod'}
        exceptions:
          type: array
          maxItems: 366
          items:
            type: object
            required: [date, reason, periods]
            properties:
              date: {type: string, format: date}
              reason: {type: string, maxLength: 100, description: Observação privada}
              periods:
                type: array
                maxItems: 8
                items: {$ref: '#/components/schemas/AvailabilityPeriod'}
    PaymentSettingsFields:
      type: object
      required: [keyType, pixKey, recipientName, paymentInstructions, cancellationPolicy, enabled]
      properties:
        keyType: {type: string, enum: [CPF, CNPJ, EMAIL, PHONE, RANDOM]}
        pixKey: {type: string, minLength: 1, maxLength: 100, description: Normalizada no servidor; valor persistido ate 77 caracteres}
        recipientName: {type: string, minLength: 2, maxLength: 100}
        paymentInstructions: {type: string, minLength: 10, maxLength: 2000}
        cancellationPolicy: {type: string, minLength: 10, maxLength: 4000}
        enabled: {type: boolean}
    PaymentSettings:
      allOf:
        - {$ref: '#/components/schemas/PaymentSettingsFields'}
        - type: object
          properties:
            configured: {const: true}
            version: {type: integer, minimum: 1}
            updatedAt: {type: string, format: date-time}
    ServiceEdit:
      type: object
      required: [name, description, durationMinutes, priceCents, bufferBeforeMinutes, bufferAfterMinutes, depositPercent, active]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, maxLength: 2000}
        durationMinutes: {type: integer, minimum: 5, maximum: 480}
        priceCents: {type: integer, minimum: 1, maximum: 100000000}
        bufferBeforeMinutes: {type: integer, minimum: 0, maximum: 240}
        bufferAfterMinutes: {type: integer, minimum: 0, maximum: 240}
        depositPercent: {type: integer, minimum: 50, maximum: 100}
        active: {type: boolean}
        version: {type: integer, minimum: 0}
    Service:
      allOf:
        - {$ref: '#/components/schemas/ServiceEdit'}
        - type: object
          properties:
            id: {type: string, format: uuid}
            depositCents: {type: integer, description: Entrada em centavos arredondada para cima pelo servidor}
    Subscription:
      type: object
      properties:
        tenantId: {type: string, format: uuid}
        planCode: {type: string, enum: [BASIC, INTERMEDIATE, PREMIUM_TOP]}
        status: {type: string, enum: [TRIAL_ACTIVE, TRIAL_EXPIRING, TRIAL_EXPIRED_BLOCKED, PAID_ACTIVE, PAST_DUE, SUSPENDED, CANCELED]}
        trialStartedAt: {type: [string, 'null'], format: date-time}
        trialEndsAt: {type: [string, 'null'], format: date-time}
        paidUntil: {type: [string, 'null'], format: date-time}
    Profile:
      type: object
      properties:
        name: {type: string}
        slug: {type: string}
        description: {type: string}
        timezone: {type: string}
        contactEmail: {type: string}
        contactPhone: {type: string}
        serviceMode: {type: string, enum: [UNSET, IN_PERSON, ONLINE, HYBRID]}
        location: {type: string}
        logoVersion: {type: [string, 'null'], format: uuid}
        profileProgress: {type: integer, enum: [25, 50, 75, 100]}
        profileComplete: {type: boolean, description: Perfil preenchido; nao significa agenda publicada}
        missingFields: {type: array, items: {type: string}}
    Error:
      type: object
      properties:
        code: {type: string}
        message: {type: string}
        correlation_id: {type: string}
