openapi: 3.1.0
info:
  title: Agendou API
  version: 0.1.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service status
  /subscriptions/{tenantId}/trial:
    post:
      summary: Start the 7-day Premium/Top trial for a tenant
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Trial subscription created
        '409':
          description: Tenant already has a subscription
  /subscriptions/{tenantId}:
    get:
      summary: Get current subscription status
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current subscription
  /subscriptions/{tenantId}/confirm-payment:
    post:
      summary: Confirm subscription payment and reactivate/preserve tenant data
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Subscription activated as paid
components:
  schemas:
    SubscriptionStatus:
      type: string
      enum:
        - TRIAL_ACTIVE
        - TRIAL_EXPIRING
        - TRIAL_EXPIRED_BLOCKED
        - PAID_ACTIVE
        - PAST_DUE
        - SUSPENDED
        - CANCELED
