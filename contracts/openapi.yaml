openapi: 3.1.0
info:
  title: Agendou API
  version: 0.7.0
  description: Identidade, assinatura e perfil. Todas as mutacoes exigem X-CSRF-TOKEN obtido em /auth/csrf, inclusive login e cadastro.
servers:
  - url: http://localhost:8080/api/v1
security:
  - session: []
paths:
  /health:
    get:
      security: []
      responses:
        '200': {description: API disponivel}
  /auth/csrf:
    get:
      security: []
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Token e nome do header CSRF; guardar o cookie de sessao
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string}
                  headerName: {type: string}
  /auth/register:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name, slug]
              properties:
                email: {type: string, format: email, maxLength: 254}
                password: {type: string, minLength: 12, maxLength: 64}
                name: {type: string, minLength: 1, maxLength: 100}
                slug: {type: string, minLength: 3, maxLength: 60, pattern: '[a-z0-9]+(?:-[a-z0-9]+)*'}
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '202': {description: Resposta generica; cadastro novo cria tenant e trial Premium de 7 dias atomicamente}
        '409': {description: Slug indisponivel ou conflito de cadastro}
        '422': {description: Campos invalidos}
  /auth/verification-email:
    post:
      security: []
      summary: Solicitar novo link de verificacao sem reiniciar o trial
      description: Resposta generica para conta inexistente, verificada ou aguardando verificacao. Reenvios em menos de 60 segundos sao agrupados. Novo token revoga o anterior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 254}
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '202': {description: Solicitacao recebida, sem confirmar existencia da conta}
        '403': {description: CSRF ausente ou invalido}
        '422': {description: Email invalido}
  /auth/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, maxLength: 64}
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '200': {description: Sessao JDBC criada; cookie SESSION HttpOnly, Secure e SameSite=Lax. Obter novo CSRF depois do login.}
        '401': {description: Credenciais invalidas ou email nao verificado}
  /auth/verify:
    post:
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Token'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '200': {description: Email verificado}
        '400': {description: Token expirado ou ja utilizado}
  /auth/logout:
    post:
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '204': {description: Sessao invalidada}
  /auth/password-reset:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '202': {description: Resposta generica sem revelar existencia da conta}
  /auth/password-reset/confirm:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string, maxLength: 128}
                password: {type: string, minLength: 12, maxLength: 64}
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '200': {description: Senha alterada e sessoes anteriores revogadas}
        '400': {description: Token expirado ou utilizado}
  /admin/subscription:
    get:
      responses:
        '200':
          description: Assinatura do tenant derivado da membership autenticada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscription'}
        '401': {description: Sessao ausente}
  /subscriptions/{tenantId}:
    get:
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Alias autenticado; somente o proprio tenant
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscription'}
        '404': {description: Tenant nao pertence ao usuario}
  /admin/profile:
    get:
      responses:
        '200':
          description: Perfil preservado inclusive durante bloqueio
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, timezone]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                description: {type: string, maxLength: 2000}
                timezone: {type: string, example: America/Sao_Paulo}
                contactEmail: {type: string, maxLength: 254, description: Email comercial valido ou vazio; omitir preserva valor anterior}
                contactPhone: {type: string, maxLength: 24, description: Telefone comercial com digitos e separadores usuais ou vazio}
                serviceMode: {type: string, enum: [UNSET, IN_PERSON, ONLINE, HYBRID]}
                location: {type: string, maxLength: 500, description: Local de atendimento; necessario para completar perfil presencial/hibrido}
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        '403': {description: Assinatura bloqueada ou CSRF invalido}
        '422': {description: Entrada invalida}
  /admin/profile/logo:
    get:
      summary: Consultar somente a logomarca do profissional autenticado, inclusive bloqueado
      responses:
        '200':
          description: Variante PNG saneada; no-store e nosniff
          content:
            image/png:
              schema: {type: string, format: binary}
        '401': {description: Sessao necessaria}
        '404': {description: Sem logomarca}
    put:
      summary: Enviar ou substituir logo PNG/JPEG, com CSRF e assinatura operacional
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary, description: Bytes brutos ate 2097152; formato verificado pelo conteudo, maximo 4096 por lado e 16 milhoes de pixels}
      responses:
        '200':
          description: Perfil atualizado; original descartado e variante PNG ate 512 pixels persistida
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        '403': {description: Assinatura bloqueada ou CSRF invalido}
        '413': {description: Arquivo maior que 2 MiB}
        '422': {description: Formato, conteudo ou dimensoes invalidos; logo anterior preservada}
    delete:
      summary: Remover logo do proprio perfil, com CSRF e assinatura operacional
      responses:
        '200':
          description: Perfil atualizado, sem logo; remocao idempotente
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        '403': {description: Assinatura bloqueada ou CSRF invalido}
  /admin/services:
    get:
      summary: Catalogo do proprio tenant, inclusive com assinatura bloqueada
      parameters:
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Ate 50 registros ordenados por criacao/id; total e activeCount do tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Service'}}
                  total: {type: integer}
                  activeCount: {type: integer}
        '401': {description: Sessao necessaria}
    post:
      summary: Cadastrar servico com assinatura operacional e CSRF
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServiceEdit'}
      responses:
        '201':
          description: Servico cadastrado; sem publicacao automatica
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Service'}
        '403': {description: Assinatura bloqueada ou CSRF invalido}
        '422': {description: Campos fora dos limites}
        '400': {description: JSON invalido ou numeros fracionarios em campos inteiros}
  /admin/services/{id}:
    put:
      summary: Editar ou inativar/reativar servico, preservando registro; version obrigatoria
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/ServiceEdit'}
                - required: [version]
      responses:
        '200':
          description: Servico atualizado com incremento de versao
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Service'}
        '403': {description: Assinatura bloqueada ou CSRF invalido}
        '404': {description: Servico inexistente ou de outro tenant}
        '409': {description: Versao desatualizada; recarregar e revisar antes de repetir}
        '422': {description: Campos invalidos ou versao ausente}
  /admin/payment-settings:
    get:
      summary: Configuracao PIX atual do proprio tenant; leitura preservada apos bloqueio
      responses:
        '200':
          description: no-store; configured=false e version=0 se ainda nao configurado
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [configured, version]
                    properties:
                      configured: {const: false}
                      version: {const: 0}
                  - {$ref: '#/components/schemas/PaymentSettings'}
        '401': {description: Sessao necessaria}
    put:
      summary: Gravar nova versao imutavel com CSRF e assinatura operacional
      description: Valida somente formato/DV. Nao consulta DICT, confirma titularidade, publica agenda ou confirma pagamento. Versao inicial zero; dados identicos nao criam nova revisao.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/PaymentSettingsFields'}
                - type: object
                  required: [version, confirmed, changeReason]
                  properties:
                    version: {type: integer, minimum: 0}
                    confirmed: {type: boolean, const: true, description: Declaracao de conferencia dos dados pelo profissional}
                    changeReason: {type: string, minLength: 10, maxLength: 500}
      responses:
        '200':
          description: Configuracao atual gravada; no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentSettings'}
        '403': {description: Assinatura bloqueada ou CSRF invalido}
        '409': {description: Versao desatualizada; recarregar e revisar}
        '422': {description: Chave/campos invalidos ou conferencia nao confirmada}
  /admin/payment-settings/history:
    get:
      summary: Ate 50 metadados de revisao, sem chaves ou textos privados
      parameters:
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Ordem de versao decrescente; no-store
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    version: {type: integer}
                    actorId: {type: string, format: uuid}
                    changedFields: {type: array, items: {type: string}}
                    enabled: {type: boolean}
                    createdAt: {type: string, format: date-time}
                    correlationId: {type: string}
        '401': {description: Sessao necessaria}
  /platform/session:
    get:
      summary: Estado do MFA da conta com PlatformRole SUPER_ADMIN
      responses:
        '200':
          description: Estado sem segredos; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrolled: {type: boolean}
                  verified: {type: boolean}
        '401': {description: Login necessario}
        '403': {description: Conta sem papel de plataforma}
  /platform/mfa/enrollment:
    post:
      summary: Iniciar configuracao TOTP com senha atual e papel de plataforma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, maxLength: 64}
      responses:
        '200':
          description: Chave Base32 de configuracao manual, validade 10 minutos; nao registrar nem armazenar no frontend
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: {type: string}
                  issuer: {type: string}
                  account: {type: string}
                  algorithm: {type: string, const: SHA1}
                  digits: {type: string, const: '6'}
                  period: {type: string, const: '30'}
        '401': {description: Senha invalida ou sessao ausente}
        '403': {description: Papel ausente ou CSRF invalido}
        '409': {description: Autenticador ja ativado}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {description: Chave de criptografia nao configurada}
  /platform/mfa/verify:
    post:
      summary: Ativar autenticador ou elevar sessao por 15 minutos, rotacionando seu identificador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, pattern: '^[0-9]{6}$'}
      responses:
        '200': {description: MFA confirmado, codigo consumido uma unica vez}
        '400': {description: Codigo invalido, expirado ou reutilizado}
        '401': {description: Login necessario}
        '403': {description: Papel ausente ou CSRF invalido}
        '429': {$ref: '#/components/responses/RateLimited'}
  /platform/tenants:
    get:
      summary: Listar ate 50 profissionais; exige papel e MFA vigente
      parameters:
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200': {description: Lista com id, slug, display_name, subscription_status, plan_code, trial_ends_at e paid_until; sem dados de clientes}
        '403': {description: Papel ausente ou MFA vencido}
  /platform/tenants/{tenantId}:
    get:
      summary: Consultar estado atualizado da assinatura e ultimas 50 decisoes
      parameters:
        - {$ref: '#/components/parameters/PlatformTenant'}
      responses:
        '200': {description: tenant, subscription e decisions; acesso auditado e protegido por MFA}
        '403': {description: Papel ausente ou MFA vencido}
        '404': {description: Profissional inexistente}
  /platform/tenants/{tenantId}/decisions:
    post:
      summary: Decisao administrativa atomica com role e MFA; nao e confirmacao automatica de banco/PIX
      parameters:
        - {$ref: '#/components/parameters/PlatformTenant'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, action, reason]
              properties:
                id: {type: string, format: uuid, description: Reutilizar para repetir a mesma decisao apos falha de rede}
                action: {type: string, enum: [CONFIRM_PAYMENT, SUSPEND, REACTIVATE]}
                reason: {type: string, minLength: 10, maxLength: 500}
                reference: {type: string, minLength: 3, maxLength: 100, description: Obrigatoria e globalmente unica para pagamento; omitir nas outras acoes}
                amountCents: {type: integer, minimum: 1, maximum: 100000000, description: Obrigatorio para pagamento; omitir nas outras acoes}
                planCode: {type: string, enum: [BASIC, INTERMEDIATE, PREMIUM_TOP], description: Obrigatorio para pagamento; omitir nas outras acoes}
      responses:
        '200': {description: Estado resultante; pagamento soma 30 dias; retirar suspensao respeita vigencia original}
        '400': {description: Combinacao de campos invalida}
        '403': {description: Papel/MFA ausente ou CSRF invalido}
        '404': {description: Profissional inexistente}
        '409': {description: Referencia duplicada, identificador reutilizado com outros dados ou transicao invalida; nenhuma mudanca parcial}
        '422': {description: Campos invalidos}
  /platform/audit:
    get:
      summary: Consultar ate 50 eventos de plataforma com MFA, sem tokens ou contatos
      parameters:
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200': {description: id, actor_id, action, tenant_id, correlation_id e created_at}
        '403': {description: Papel ausente ou MFA vencido}
components:
  parameters:
    Offset:
      name: offset
      in: query
      schema: {type: integer, default: 0, minimum: 0, maximum: 100000}
    PlatformTenant:
      name: tenantId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    RateLimited:
      description: Limite de tentativas excedido. Aguardar Retry-After antes de repetir.
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
          description: Segundos restantes ate a proxima janela
        X-Correlation-ID:
          schema: {type: string, format: uuid}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  securitySchemes:
    session: {type: apiKey, in: cookie, name: SESSION}
  requestBodies:
    Token:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: {type: string, maxLength: 128}
  schemas:
    PaymentSettingsFields:
      type: object
      required: [keyType, pixKey, recipientName, paymentInstructions, cancellationPolicy, enabled]
      properties:
        keyType: {type: string, enum: [CPF, CNPJ, EMAIL, PHONE, RANDOM]}
        pixKey: {type: string, minLength: 1, maxLength: 100, description: Normalizada no servidor; valor persistido ate 77 caracteres}
        recipientName: {type: string, minLength: 2, maxLength: 100}
        paymentInstructions: {type: string, minLength: 10, maxLength: 2000}
        cancellationPolicy: {type: string, minLength: 10, maxLength: 4000}
        enabled: {type: boolean}
    PaymentSettings:
      allOf:
        - {$ref: '#/components/schemas/PaymentSettingsFields'}
        - type: object
          properties:
            configured: {const: true}
            version: {type: integer, minimum: 1}
            updatedAt: {type: string, format: date-time}
    ServiceEdit:
      type: object
      required: [name, description, durationMinutes, priceCents, bufferBeforeMinutes, bufferAfterMinutes, depositPercent, active]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, maxLength: 2000}
        durationMinutes: {type: integer, minimum: 5, maximum: 480}
        priceCents: {type: integer, minimum: 1, maximum: 100000000}
        bufferBeforeMinutes: {type: integer, minimum: 0, maximum: 240}
        bufferAfterMinutes: {type: integer, minimum: 0, maximum: 240}
        depositPercent: {type: integer, minimum: 50, maximum: 100}
        active: {type: boolean}
        version: {type: integer, minimum: 0}
    Service:
      allOf:
        - {$ref: '#/components/schemas/ServiceEdit'}
        - type: object
          properties:
            id: {type: string, format: uuid}
            depositCents: {type: integer, description: Entrada em centavos arredondada para cima pelo servidor}
    Subscription:
      type: object
      properties:
        tenantId: {type: string, format: uuid}
        planCode: {type: string, enum: [BASIC, INTERMEDIATE, PREMIUM_TOP]}
        status: {type: string, enum: [TRIAL_ACTIVE, TRIAL_EXPIRING, TRIAL_EXPIRED_BLOCKED, PAID_ACTIVE, PAST_DUE, SUSPENDED, CANCELED]}
        trialStartedAt: {type: [string, 'null'], format: date-time}
        trialEndsAt: {type: [string, 'null'], format: date-time}
        paidUntil: {type: [string, 'null'], format: date-time}
    Profile:
      type: object
      properties:
        name: {type: string}
        slug: {type: string}
        description: {type: string}
        timezone: {type: string}
        contactEmail: {type: string}
        contactPhone: {type: string}
        serviceMode: {type: string, enum: [UNSET, IN_PERSON, ONLINE, HYBRID]}
        location: {type: string}
        logoVersion: {type: [string, 'null'], format: uuid}
        profileProgress: {type: integer, enum: [25, 50, 75, 100]}
        profileComplete: {type: boolean, description: Perfil preenchido; nao significa agenda publicada}
        missingFields: {type: array, items: {type: string}}
    Error:
      type: object
      properties:
        code: {type: string}
        message: {type: string}
        correlation_id: {type: string}
