services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: agendou
      POSTGRES_USER: agendou_app
      POSTGRES_PASSWORD: agendou_app
    ports:
      - "5432:5432"
    volumes:
      - agendou_postgres:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agendou
      MINIO_ROOT_PASSWORD: agendou-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - agendou_minio:/data

volumes:
  agendou_postgres:
  agendou_minio:
